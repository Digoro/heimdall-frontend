server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 크기 제한
    client_max_body_size 5G;
    # 업로드/다운로드 타임아웃
    client_body_timeout 600s; # 클라이언트 요청 바디 수신 타임아웃
    send_timeout 600s; # 클라이언트 응답 전송 타임아웃

    location /api-docs-light {
        proxy_pass http://backend:3000/api-docs-light;
    }

    location /api-docs-dark {
        proxy_pass http://backend:3000/api-docs-dark;
    }

    location /static/swagger-dark.js {
        proxy_pass http://backend:3000/static/swagger-dark.js;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 프록시 타임아웃
        proxy_connect_timeout 60s; # 백엔드에 TCP 연결 맺는 시간
        proxy_read_timeout 600s; # 백엔드로 요청 전송 타임아웃
        proxy_send_timeout 600s; # 백엔드로 응답 대기 타임아웃

        # 버퍼
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}