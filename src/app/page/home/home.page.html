<z-layout class="border">
  <z-header>
    <div class="flex w-full items-center justify-between">
      <div class="flex gap-6 items-center">
        <div class="flex items-center text-lg font-semibold">
          <img src="oms_logo.png" width="24" />
          <span class="ml-2">Order Management System</span>
        </div>
        <div>
          <z-breadcrumb zWrap="wrap" zAlign="start">
            <z-breadcrumb-item>
              <span aria-current="page">API Keys</span>
            </z-breadcrumb-item>
          </z-breadcrumb>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <img src="Hanwha Systems_RGB_43_EH.png" width="164" />
      </div>
    </div>
  </z-header>
</z-layout>

<div class="h-screen -mt-16.5 pt-16.5">
  <z-layout class="h-full">
    <z-sidebar
      [zWidth]="250"
      [zCollapsible]="true"
      [zCollapsed]="sidebarCollapsed()"
      [zCollapsedWidth]="70"
      (zCollapsedChange)="onCollapsedChange($event)"
      class="p-0!"
    >
      <nav
        [class]="
          'flex h-full flex-col overflow-hidden ' +
          (sidebarCollapsed() ? 'gap-1 p-1 pt-4' : 'gap-4 p-4')
        "
      >
        <z-sidebar-group>
          @if (!sidebarCollapsed()) {
            <z-sidebar-group-label>API</z-sidebar-group-label>
          }
          @for (item of mainMenuItems; track item.label) {
            <button
              type="button"
              z-button
              zType="ghost"
              [class]="sidebarCollapsed() ? 'justify-center' : 'justify-start'"
              zPosition="right"
              (click)="goTo()"
            >
              <z-icon [zType]="item.icon" [class]="sidebarCollapsed() ? '' : 'mr-2'" />
              @if (!sidebarCollapsed()) {
                <span>{{ item.label }}</span>
              }
            </button>
          }
        </z-sidebar-group>

        <div class="mt-auto">
          <div
            z-menu
            [zMenuTriggerFor]="userMenu"
            zPlacement="rightBottom"
            [class]="
              'hover:bg-accent flex cursor-pointer items-center justify-center gap-2 rounded-md ' +
              (sidebarCollapsed() ? 'm-2 p-0' : 'p-2')
            "
          >
            <z-avatar
              zSrc="https://zardui.com/images/avatar/imgs/avatar_image.jpg"
              zAlt="Zard UI"
            />

            @if (!sidebarCollapsed()) {
              <div>
                <span class="font-medium">zardui</span>
                <div class="text-xs">test&#64;zardui.com</div>
              </div>

              <z-icon zType="chevrons-up-down" class="ml-auto" />
            }
          </div>

          <ng-template #userMenu>
            <div z-menu-content class="w-48">
              <button type="button" z-menu-item>
                <z-icon zType="user" class="mr-2" />
                Profile
              </button>
              <button type="button" z-menu-item>
                <z-icon zType="settings" class="mr-2" />
                Settings
              </button>
              <z-divider zSpacing="sm" />
              <button type="button" z-menu-item>
                <z-icon zType="log-out" class="mr-2" />
                Logout
              </button>
            </div>
          </ng-template>
        </div>
      </nav>
    </z-sidebar>

    <z-content class="min-h-50">
      <router-outlet />
      <z-toaster />
    </z-content>
  </z-layout>
</div>
